services:
  - type: web
    name: face-demo-backend
    runtime: python
    rootDir: face-demo-app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 app:app
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
