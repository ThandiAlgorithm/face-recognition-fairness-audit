# app name must be globally unique on Fly -- `fly launch` will prompt you to
# change this if "face-demo-backend" is already taken.
app = "face-demo-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
