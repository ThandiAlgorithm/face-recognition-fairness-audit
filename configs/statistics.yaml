meta:
  source_issue: GOV-004
  version: 1.1.0
  frozen: true
  frozen_date: 2026-09-17
  frozen_commit: 6a5bef9ff727c793f0e710231d98118ceffaab7d
  approved_by: RZ and TM

global:
  alpha: 0.05
  ci_level: 0.95
  seed: 26041
  primary_fairness_criterion: equalised_odds
  secondary_fairness_criteria: [demographic_parity, equality_of_opportunity]

bootstrap:
  iterations: 5000
  seed: 26041
  method: percentile
  dependence_rule:
    lfw_image_analysis: resample_by_identity
    lfw_verification: resample_preserving_fold_and_pair_type
    single_image_datasets: resample_image_rows

multiple_testing:
  method: benjamini_hochberg
  q: 0.05
  code_name: BH_FDR
  fairness_metric_code_name: fairness_discrepancy_rate
  families:
    - {id: FAM_DETECTION, scope: detector_and_alignment_subgroup_tests}
    - {id: FAM_VISUAL, scope: brightness_contrast_sharpness_facesize_pose_subgroup_tests}
    - {id: FAM_MEASUREMENT, scope: skin_measurement_disagreement_and_boundary_tests}
    - {id: FAM_SHIFT, scope: cross_dataset_distribution_tests}
    - {id: FAM_LFW_PROTOCOL, scope: lfw_yoking_and_protocol_bias_tests}
    - {id: EXPLORATORY, scope: not_pooled_into_confirmatory_families}

test_map:
  two_group_continuous:
    applies_to: [brightness, contrast, sharpness, face_px_area, face_area_ratio, ITA, L_star, hue_angle]
    primary_test: mann_whitney_u
    effect_size: cliffs_delta
    report: [median, iqr, median_difference, ci_95]
    secondary_test: kolmogorov_smirnov

  multi_group_continuous:
    primary_test: kruskal_wallis
    effect_size: epsilon_squared
    followup: planned_pairwise_only
    followup_correction: benjamini_hochberg

  binary_outcome_two_groups:
    applies_to: [detected, alignment_valid, skin_roi_valid]
    primary_test: fisher_exact
    effect_size: absolute_risk_difference
    also_report: [risk_ratio, ci_95, raw_counts]

  binary_outcome_multi_group:
    primary_test: chi_square
    effect_size: cramers_v
    also_report: [per_group_rate, per_group_count]

  paired_classifier_comparison:
    primary_test: mcnemar
    effect_size: paired_error_rate_difference
    ci: 95
    condition: same_test_examples_both_models

agreement:
  icc:
    model: two_way_mixed_effects
    definition: absolute_agreement
    type: single_measurement
    computed_on: ordinal_rank_1_to_6
    interpretation_bands:
      poor: "<0.50"
      moderate: "0.50-0.75"
      good: "0.75-0.90"
      excellent: ">0.90"
    report_band_name_not_word_substantial: true
    ci_required: true

  weighted_kappa:
    weights: linear
    computed_on: ordinal_rank_1_to_6

  unweighted_kappa:
    computed_on: skin_binary

  additional_outputs:
    - within_one_category_agreement
    - confusion_matrix_6x6
    - confusion_matrix_binary
    - disagreement_rate_vs_distance_from_ita_threshold

  treats_either_route_as_ground_truth: false

verification_metrics:
  threshold_policy: single_fixed_threshold_for_all_subgroups
  report_per_subgroup: [fmr, fnmr, subgroup_difference, ci_95, n]
  additional: [within_demographic_vs_cross_demographic_difference]
  per_subgroup_threshold_in_primary_analysis: false

reporting:
  report_errors_not_accuracies: true
  effect_size_required_for_every_test: true
  n_required_in_every_table: true
