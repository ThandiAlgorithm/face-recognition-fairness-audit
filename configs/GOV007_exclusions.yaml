meta:
  issue: GOV-007
  version: 1.0.0
  frozen: false
  frozen_date: null
  frozen_commit: null
  approved_by: []

failure_handling:
  delete_rows: false
  every_exclusion_needs_reason: true

  cases:
    corrupt_file:
      keep_row: true
      eligible: []
      reason: corrupt_file
    decode_failure:
      keep_row: true
      eligible: []
      reason: decode_failure
    label_parse_failure:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: label_parse_failure
    missing_demographic_label:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: missing_required_label
    zero_detection:
      keep_row: true
      eligible: [detection]
      reason: zero_detection
    multi_detection:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: null
    alignment_failure:
      keep_row: true
      eligible: [detection]
      reason: alignment_failure
    invalid_skin_roi:
      keep_row: true
      eligible: [detection, visual]
      reason: invalid_skin_roi
    greyscale:
      keep_row: true
      eligible: [detection, visual]
      reason: greyscale_no_chroma
    ita_undefined:
      keep_row: true
      eligible: [detection, visual]
      reason: ita_undefined
    exact_duplicate:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: exact_duplicate
    near_duplicate_confirmed:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: near_duplicate_confirmed
    cross_dataset_dup:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: cross_dataset_duplicate_confirmed
    low_confidence_label:
      keep_row: true
      eligible: [detection, visual, skin]
      reason: low_confidence_label
    thin_cell:
      keep_row: true
      eligible: all
      reason: thin_cell

low_confidence_labels:
  threshold: 0.70
  policy: recode_to_unknown_for_confirmatory_analysis
  preserve_original_prediction: true
  preserve_original_confidence: true

duplicates:
  exact:
    action: group_and_flag
    report_both: [raw_file_count, unique_image_count]
    allow_duplicate_weighting_in_model_evaluation: false
  near:
    action: flag_for_review
    auto_delete: false
    statuses: [candidate, confirmed, false_alarm, uncertain]
  cross_dataset:
    action: flag_and_report
    report_even_if_zero: true
    excluded_from: [eligible_cross_dataset_eval]
  lfw_pair_exception:
    rewrite_official_protocol: false
    handling: flag_and_report_sensitivity

exclusion_reason_vocabulary:
  - corrupt_file
  - decode_failure
  - label_parse_failure
  - missing_required_label
  - low_confidence_label
  - zero_detection
  - multi_detection_unresolved
  - alignment_failure
  - invalid_skin_roi
  - greyscale_no_chroma
  - ita_undefined
  - exact_duplicate
  - near_duplicate_confirmed
  - cross_dataset_duplicate_confirmed
  - thin_cell

eligibility_masks:
  eligible_detection_audit: "not corrupt and not decode_failure"
  eligible_visual_audit: "eligible_detection_audit and n_detections >= 1 and alignment_valid"
  eligible_skin_audit: "eligible_visual_audit and skin_roi_valid and not is_greyscale and not ita_undefined"
  eligible_demographic_audit: "gender != unknown and gender_confidence >= 0.70"
  eligible_cross_dataset_eval: "eligible_skin_audit and not cross_dataset_dup"
  eligible_lfw_pair_eval: "both_members_eligible_skin_audit and pair_demog_complete"

reconciliation:
  rule: "input_count == eligible_count + sum(excluded_by_reason)"
  enforced_by: scripts/validate_master_table.py
